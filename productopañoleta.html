<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Producto - ECOTEXTIL</title>
  <link rel="stylesheet" href="styleslavanda.css">
  <style>
    .producto-detalle {
      display: flex;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 2rem auto;
      gap: 2rem;
    }

    .galeria {
      flex: 1;
      min-width: 300px;
    }

    .imagenes-lado-a-lado {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .imagen-secundaria-con-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 48%;
    }

    .imagen-secundaria-con-info img {
      width: 100%;
      border-radius: 10px;
    }

    .acordeon {
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    .acordeon button {
      width: 100%;
      background-color: #f1f1f1;
      border: none;
      outline: none;
      padding: 0.75rem;
      text-align: left;
      cursor: pointer;
      font-weight: bold;
    }

    .acordeon-content {
      display: none;
      padding: 0.75rem;
      background-color: #fff;
      font-size: 0.95rem;
    }

    .acordeon.active .acordeon-content {
      display: block;
    }

    .miniaturas {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .miniaturas img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 8px;
    }

    .miniaturas img:hover {
      border-color: #ccc;
    }

    .info {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .precio {
      font-size: 1.8rem;
      color: #444;
    }

    .mensaje {
      color: green;
      margin-top: 1rem;
    }

    .carrito-contador {
      position: relative;
    }

    .carrito-contador span {
      position: absolute;
      top: -8px;
      right: -8px;
      background-color: red;
      color: white;
      border-radius: 50%;
      padding: 0.2rem 0.5rem;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <!-- Tu header original aquí -->
  </header>

  <main class="producto-detalle">
    <div class="galeria">
      <div class="imagenes-lado-a-lado">
        <!-- Imagen principal -->
        <img id="imagen-principal" src="img/pañoleta.jpg" alt="Pañoleta" style="width:48%; border-radius:10px;">

        <!-- Imagen secundaria con acordeón -->
        <div class="imagen-secundaria-con-info">
          <img id="imagen-secundaria" src="img/pañoletagrande.jpg" alt="Vista lateral">

          <div class="acordeon" id="acordeon-info">
            <button onclick="toggleAcordeon('acordeon-info')">Características</button>
            <div class="acordeon-content">
                
                <li>79 cm x 37 cm <li>
            </div>
          </div>
        </div>
      </div>

      <div class="miniaturas">
        <img src="img/aa8e4733-b6d7-4a26-a543-913276acf397.jpg" alt="Mini 1" onclick="cambiarImagen(this)">        
        <img src="img/187f001f-9564-4f4b-a9fb-344d77881b4d.jpg" alt="Mini 2" onclick="cambiarImagen(this)">                
      </div>
    </div>

    <div class="info">
      <h2>Pañoleta</h2>
      <p>Pañoleta para tu mascota.</p>
      <p class="precio">$8.000</p>

      <button class="btn-agregar" onclick="agregarAlCarrito()">Añadir al carrito</button>
      <p class="mensaje" id="mensaje-ok" style="display: none;">Producto agregado al carrito</p>
    </div>
  </main>

  <footer>
    <!-- Tu footer original aquí -->
  </footer>

  <script>
    function cambiarImagen(img) {
      document.getElementById('imagen-principal').src = img.src;
    }

    function agregarAlCarrito() {
      const nombre = document.querySelector('.info h2').textContent.trim();
      const precioTexto = document.querySelector('.precio').textContent.replace(/[^\d]/g, '');
      const precio = parseInt(precioTexto, 10) || 0;
      const cantidad = 1;
      const imagen = document.getElementById('imagen-principal').src;

      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      const index = carrito.findIndex(item => item.nombre === nombre);

      if (index > -1) {
        carrito[index].cantidad += cantidad;
      } else {
        carrito.push({ nombre, precio, cantidad, imagen });
      }

      localStorage.setItem('carrito', JSON.stringify(carrito));

      let total = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      localStorage.setItem('carritoCantidad', total);
      document.getElementById('contador-carrito').textContent = total;

      document.getElementById('mensaje-ok').style.display = 'block';
      setTimeout(() => {
        document.getElementById('mensaje-ok').style.display = 'none';
      }, 1500);
    }

    function actualizarContadorCarrito() {
      const cantidad = localStorage.getItem('carritoCantidad') || '0';
      const contador = document.getElementById('contador-carrito');
      if (contador) contador.textContent = cantidad;
    }

    function toggleAcordeon(id) {
      const acordeon = document.getElementById(id);
      acordeon.classList.toggle('active');
    }

    actualizarContadorCarrito();
  </script>
</body>
</html>
